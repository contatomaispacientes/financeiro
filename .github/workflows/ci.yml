# FND-07.1 — lint, typecheck, testes unitários e de integração e build a cada push na main e em PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions fixadas por commit (versão no comentário): uma tag movida não muda o que roda aqui.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — versão do packageManager

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # O postinstall compila o packages/shared e gera o client do Prisma.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários (shared, api, web)
        run: pnpm test

      # Postgres e Redis reais via Testcontainers (Docker já vem no runner do GitHub).
      - name: Testes de integração da API
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
