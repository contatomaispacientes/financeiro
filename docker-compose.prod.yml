# Produção na VPS (docs/deploy.md). Lê as variáveis do arquivo .env ao lado.
#   docker compose -f docker-compose.prod.yml up -d --build
name: financeiro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: financeiro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://financeiro:${POSTGRES_PASSWORD}@postgres:5432/financeiro
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: https://${DOMAIN:?defina DOMAIN no .env}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/apps/api/storage
    volumes:
      - storage:/app/apps/api/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: financeiro
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: financeiro
      BACKUP_KEEP_DAYS: 30
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
